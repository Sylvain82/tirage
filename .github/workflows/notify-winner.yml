name: Notify winner

on:
  schedule:
    # Du lundi au vendredi, toutes les 5 minutes de 4h00 à 11h59 UTC : couvre 6h/7h à 13h/14h heure de Paris
    # (été ou hiver), avec de la marge autour des inscriptions (7h00-11h55) et du tirage (11h56).
    - cron: "*/5 4-11 * * 1-5"
    # Un passage supplémentaire à 11h57 pile heure de Paris : 9h57 UTC l'été, 10h57 UTC l'hiver.
    # (Le passage de l'autre saison tombe hors créneau et ne fait rien.)
    - cron: "57 9-10 * * 1-5"
  workflow_dispatch: {} # lancement manuel depuis l'onglet Actions, pour tester

# Un seul passage à la fois : évite deux exécutions simultanées autour de 11h57.
concurrency:
  group: notify-winner
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Tirage de secours (si besoin) puis notification
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node send-notifications.js
