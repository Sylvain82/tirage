name: Notify winner

on:
  schedule:
    # Filet de sécurité. ATTENTION : GitHub ne tient PAS ces horaires (le dépôt n'est réveillé que 3 fois par jour
    # environ, parfois plusieurs heures après l'heure prévue). Pour une notification immédiate, un déclencheur
    # externe lance ce même workflow à heure fixe avec « watch = true » (voir la notice de mise en place).
    - cron: "*/5 4-11 * * 1-5"
    - cron: "57 9-10 * * 1-5"
  workflow_dispatch:
    inputs:
      watch:
        description: "Rester en veille jusqu'au tirage (à activer pour le déclencheur de 11h00 ; sinon une seule vérification)"
        type: boolean
        default: false

# Une seule veille à la fois. Un lancement manuel ordinaire (sans veille) a son propre groupe : il n'attend pas.
concurrency:
  group: notify-winner-${{ (github.event_name == 'workflow_dispatch' && !inputs.watch) && 'manual' || 'auto' }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Veille, tirage de secours (si besoin) puis notification
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ONESHOT: ${{ (github.event_name == 'workflow_dispatch' && !inputs.watch) && '1' || '' }}
          FORCE_WATCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.watch) && '1' || '' }}
        run: node send-notifications.js
