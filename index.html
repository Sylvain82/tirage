    apiKey: "AIzaSyDipngZ7rA-TgyQQ-eB-1veggfbcmpHd2s",
    authDomain: "tirage-repas.firebaseapp.com",
    projectId: "tirage-repas",
    storageBucket: "tirage-repas.firebasestorage.app",
    messagingSenderId: "634341227314",
    appId: "1:634341227314:web:2d00ba1cbee9dbd46d752b",
    measurementId: "G-7HSTL97R21",
  };

  // ============================================================
  // 3. Initialisation Firebase
  // ============================================================
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const messaging = getMessaging(app);

  // ============================================================
  // 4. Demander la permission et récupérer le token FCM
  // ============================================================
  async function requestNotificationPermission() {
    if (!("Notification" in window)) {
      console.log("Les notifications ne sont pas supportées.");
      return;
    }

    try {
      const permission = await Notification.requestPermission();
      if (permission === "granted") {
        console.log("✅ Permission accordée pour les notifications !");

        // Récupérer le token FCM
        const token = await getToken(messaging, {
          vapidKey: "BAFxMRVQ0b9IVp_9LZ2lOt4aHjnCrBXG7Ik0GUs56dj_a3S0112qA4eAlxWkQl1m5WSC7n7yF7ukRHDgYl-Hkss"
        });
        console.log("🔥 Token FCM :", token); // <-- LE TOKEN APPARAÎT ICI DANS LA CONSOLE
        return token;
      } else {
        console.log("❌ Permission refusée.");
      }
    } catch (error) {
      console.error("Erreur FCM :", error);
    }
  }

  // ============================================================
  // 5. Écouter les messages en premier plan (optionnel)
  // ============================================================
  onMessage(messaging, (payload) => {
    console.log("Message FCM reçu en premier plan :", payload);
    const notificationTitle = payload.notification?.title || "Tirage du jour 🥡";
    const notificationOptions = {
      body: payload.notification?.body || "Un gagnant a été désigné !",
      icon: "/icon-192.png",
    };
    new Notification(notificationTitle, notificationOptions);
  });

  // ============================================================
  // 6. Appeler requestNotificationPermission() après l'init
  // ============================================================
  requestNotificationPermission();
