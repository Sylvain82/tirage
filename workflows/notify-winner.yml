name: Notify winner

on:
  schedule:
    # Toutes les 5 minutes, de 4h00 à 11h59 UTC — couvre 6h/7h à 13h/14h
    # heure de Paris selon l'heure d'été ou d'hiver, avec de la marge
    # autour du créneau d'inscription (7h00-11h55) et du tirage (11h56).
    - cron: "*/5 4-11 * * *"
  workflow_dispatch: {} # permet de le lancer manuellement depuis l'onglet Actions, pour tester

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Envoyer la notification si un gagnant vient d'être désigné
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node send-notifications.js
